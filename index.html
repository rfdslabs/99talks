<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>99talks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a09;
    --bg-2: #1a1614;
    --fg: #f5f1ea;
    --muted: #8a8074;
    --accent: #ff6b1a;
    --accent-dim: #b94e0f;
    --line: #2a241f;
    --good: #7cb86e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at top left, rgba(255,107,26,0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(255,107,26,0.04), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 32px 96px;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px; margin-bottom: 32px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(32px, 5vw, 56px);
    margin: 0;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  h1 .accent { color: var(--accent); font-style: italic; }
  .meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 8px;
    vertical-align: middle;
  }
  .status-dot.live {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .controls {
    display: flex; gap: 12px; margin-bottom: 32px;
    flex-wrap: wrap;
  }
  input[type=text] {
    flex: 1; min-width: 280px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-weight: 800;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 14px 24px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: #ff8540; }
  button:active { transform: translateY(1px); }
  button.ghost {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }

  .status-bar {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 24px;
    min-height: 18px;
  }

  .transcript {
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 24px 28px;
    min-height: 400px;
    max-height: 70vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-dim) var(--bg-2);
  }
  .transcript::-webkit-scrollbar { width: 8px; }
  .transcript::-webkit-scrollbar-track { background: var(--bg-2); }
  .transcript::-webkit-scrollbar-thumb { background: var(--accent-dim); }

  .seg {
    display: flex; gap: 16px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
    animation: in 0.3s ease-out;
  }
  .seg:last-child { border-bottom: none; }
  .seg .ts {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--muted);
    padding-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .seg .text {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    line-height: 1.5;
    letter-spacing: -0.005em;
  }
  .seg.latest .text { color: var(--accent); }
  @keyframes in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .empty {
    color: var(--muted);
    font-style: italic;
    text-align: center;
    padding: 80px 20px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
  }

  select {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    padding: 0 12px;
    outline: none;
  }
  select:focus { border-color: var(--accent); }
  .export-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .export-row .label, h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted);
    font-weight: 400; margin: 0 8px 0 0;
  }
  button.small { padding: 8px 12px; font-size: 11px; }

  .sessions { margin-top: 48px; }
  .sessions h2 { margin-bottom: 16px; }
  .session {
    display: flex; gap: 16px; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap;
  }
  .session .info { min-width: 0; flex: 1; }
  .session .title {
    font-family: 'Fraunces', serif; font-size: 17px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .session .live-tag { color: var(--accent); }
  .session .actions { display: flex; gap: 6px; }

  @media (max-width: 600px) {
    .wrap { padding: 32px 16px 64px; }
    .transcript { padding: 16px; }
    .seg { flex-direction: column; gap: 4px; }
  }

  footer {
    margin-top: 40px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>99<span class="accent">talks</span></h1>
    <div class="meta"><span class="status-dot" id="dot"></span><span id="state-label">offline</span></div>
  </header>

  <div class="controls">
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." aria-label="Live stream URL">
    <select id="lang" aria-label="Spoken language">
      <option value="auto">Auto-detect</option>
      <option value="en">English</option>
      <option value="pt">Portuguese</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="ja">Japanese</option>
      <option value="zh">Chinese</option>
    </select>
    <button id="start">Start</button>
    <button id="stop" class="ghost">Stop</button>
  </div>

  <div class="export-row">
    <span class="label">Export current</span>
    <button class="ghost small" data-fmt="md">Markdown</button>
    <button class="ghost small" data-fmt="txt">TXT</button>
    <button class="ghost small" data-fmt="srt">SRT</button>
    <button class="ghost small" data-fmt="vtt">VTT</button>
  </div>

  <div class="status-bar" id="status"></div>

  <div class="transcript" id="transcript">
    <div class="empty">Paste a live stream URL and hit Start.</div>
  </div>

  <section class="sessions">
    <h2>Sessions</h2>
    <div id="sessions"><div class="sub">No sessions yet.</div></div>
  </section>

  <footer>99talks · local transcription with faster-whisper</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const transcript = $('transcript');
const status = $('status');
const dot = $('dot');
const stateLabel = $('state-label');
let lastSeg = null;
let currentSession = null;

try { const l = localStorage.getItem('99talks.lang'); if (l) $('lang').value = l; } catch {}

function setLive(on) {
  dot.classList.toggle('live', on);
  stateLabel.textContent = on ? 'live' : 'offline';
}

function fmtTime(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}

function clearTranscript() {
  transcript.innerHTML = '';
}

function addSegment(entry) {
  if (transcript.querySelector('.empty')) clearTranscript();
  if (lastSeg) lastSeg.classList.remove('latest');
  const div = document.createElement('div');
  div.className = 'seg latest';
  const ts = document.createElement('div');
  ts.className = 'ts';
  ts.textContent = entry.start != null ? fmtTime(entry.start) : entry.ts;
  ts.title = `wall clock ${entry.ts}`;
  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = entry.text;
  div.append(ts, text);
  const atBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 80;
  transcript.appendChild(div);
  if (atBottom) transcript.scrollTop = transcript.scrollHeight;
  lastSeg = div;
}

function exportUrl(fmt, session) {
  const q = new URLSearchParams({fmt});
  if (session) q.set('session', session);
  return '/export?' + q;
}

function exportButton(fmt, label, session) {
  const b = document.createElement('button');
  b.className = 'ghost small';
  b.textContent = label;
  b.addEventListener('click', () => { window.location.href = exportUrl(fmt, session); });
  return b;
}

async function loadSessions() {
  let list;
  try { list = await (await fetch('/sessions')).json(); } catch { return; }
  const box = $('sessions');
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="sub">No sessions yet.</div>';
    return;
  }
  for (const s of list) {
    const row = document.createElement('div');
    row.className = 'session';
    const info = document.createElement('div');
    info.className = 'info';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = s.title || s.url || s.id;
    title.title = s.url || '';
    const sub = document.createElement('div');
    sub.className = 'sub';
    const date = s.started_at ? s.started_at.replace('T', ' ').slice(0, 16) : '';
    const parts = [date, s.channel, fmtTime(s.duration), `${s.segments} segments`, s.language].filter(Boolean);
    sub.textContent = parts.join(' · ');
    if (s.live) {
      const tag = document.createElement('span');
      tag.className = 'live-tag';
      tag.textContent = ' · recording';
      sub.appendChild(tag);
    }
    info.append(title, sub);
    const actions = document.createElement('div');
    actions.className = 'actions';
    if (s.segments) {
      actions.append(
        exportButton('md', 'MD', s.id), exportButton('txt', 'TXT', s.id),
        exportButton('srt', 'SRT', s.id), exportButton('vtt', 'VTT', s.id),
      );
    }
    row.append(info, actions);
    box.appendChild(row);
  }
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { status.textContent = 'Connected to server.'; };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'segment') {
      addSegment(m);
      setLive(true);
    } else if (m.type === 'status') {
      status.textContent = m.message;
      if (m.phase === 'capturing') setLive(true);
      if (m.phase === 'ended') setLive(false);
    } else if (m.type === 'error') {
      status.textContent = 'Error: ' + m.message;
      setLive(false);
    } else if (m.type === 'sessions_changed') {
      loadSessions();
    }
  };
  ws.onclose = () => {
    setLive(false);
    status.textContent = 'Disconnected. Reconnecting in 2s...';
    setTimeout(connectWS, 2000);
  };
}

$('start').addEventListener('click', async () => {
  const url = $('url').value.trim();
  if (!url) return;
  const language = $('lang').value;
  try { localStorage.setItem('99talks.lang', language); } catch {}
  status.textContent = 'Starting capture (the first chunk takes a few seconds)...';
  clearTranscript();
  lastSeg = null;
  const r = await fetch('/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url, language})
  });
  const j = await r.json();
  if (!j.ok) { status.textContent = 'Failed: ' + (j.error || 'unknown error'); return; }
  currentSession = j.session;
  loadSessions();
});

$('stop').addEventListener('click', async () => {
  await fetch('/stop', {method: 'POST'});
  setLive(false);
});

document.querySelectorAll('.export-row button[data-fmt]').forEach((b) => {
  b.addEventListener('click', () => { window.location.href = exportUrl(b.dataset.fmt, currentSession); });
});

connectWS();
loadSessions();
</script>
</body>
</html>
